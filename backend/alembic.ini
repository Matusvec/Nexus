# A generic, single database configuration.

[alembic]
# path to migration environment
script_location = alembic

# Use DATABASE_URL from environment; Alembic env.py overrides this at runtime.
sqlalchemy.url = postgresql://nexus:nexus@localhost:5432/nexus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
