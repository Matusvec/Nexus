name: HITL Kernel CI

on:
  push:
    paths:
      - 'kernel/**'
      - 'agents/manifests/**'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'agents/manifests/**'
      - '.github/workflows/kernel-ci.yml'

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Run kernel unit tests
        run: python -m pytest kernel/tests/ -v

      - name: Run contract guard check
        run: python kernel/check_changes --repo-path .
